apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-administrative-core
  namespace: qa
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ms-administrative-core
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ms-administrative-core
    spec:
      containers:
      - name: ms-administrative-core
        image: southamerica-east1-docker.pkg.dev/zera-509513/repo/ms-administrative-core:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        # A subida leva ~2 min com o limite de 0,5 CPU (medido: 133s em 2026-10-16). Sem este
        # startupProbe a liveness comecava aos 90s e matava o pod aos ~130s, poucos segundos antes
        # de o Tomcat abrir a porta: reinicio em loop, 0/1 Ready, sem erro algum no log da aplicacao.
        # Ate ele passar, liveness e readiness ficam desligadas; teto de 10s x 30 = 300s.
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 3
        envFrom:
        # Bootstrap opcional do primeiro MANAGER (BOOTSTRAP_ADMIN_*). Ver k8s/README.md.
        - secretRef:
            name: ms-administrative-core-bootstrap
            optional: true
        env:
        - name: DB_HOST
          value: "postgres"
        # Fila de alertas (Redis Streams, ligada por padrao). Ver k8s/redis-qa.yaml.
        # Nome "redis-alerts", NAO "redis": esse nome ja e usado pelo ms-artificial-intelligence-core
        # no mesmo namespace (seu proprio Deployment/Service), e colidiu com o nosso uma vez.
        - name: REDIS_HOST
          value: "redis-alerts"
        - name: REDIS_PORT
          value: "6379"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_DB
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_PASSWORD
        - name: ZERA_JWT_ISSUER
          value: "ms-administrative-core-qa"
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: ms-administrative-core-jwt
              key: private.pem
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: ms-administrative-core-jwt
              key: public.pem
        - name: MS_INVENTORY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: zera-service-clients
              key: ms-inventory
        # Recicladoras proximas (Google Places). optional: true para o pod nao entrar em
        # crash loop se o secret ainda nao existir — sem a chave, o endpoint responde 503
        # em vez de subir, ver GooglePlacesConfig.
        - name: GOOGLE_PLACES_ENABLED
          value: "true"
        - name: GOOGLE_PLACES_API_KEY
          valueFrom:
            secretKeyRef:
              name: google-places
              key: api-key
              optional: true
        # Push notification de alerta (FCM). optional: true pelo mesmo motivo do Google Places:
        # sem o secret o pod sobe normal, so com NoopPushNotificationGateway (ver FcmConfig).
        - name: FCM_ENABLED
          value: "true"
        - name: FCM_CREDENTIALS_JSON
          valueFrom:
            secretKeyRef:
              name: fcm-credentials
              key: credentials.json
              optional: true
        # Recuperacao de senha (Resend). optional: true pelo mesmo motivo do Google Places: sem o
        # secret o pod sobe normal, so a chamada ao Resend falha (logada, nunca derruba o fluxo).
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: resend
              key: api-key
              optional: true
        - name: RESEND_FROM_EMAIL
          valueFrom:
            secretKeyRef:
              name: resend
              key: from-email
              optional: true
        # Sync periodico com o banco legado (LegacySyncConfig). Diferente dos secrets de integracao
        # acima, SEM optional: com LEGACY_SYNC_ENABLED=true e URL vazia o bean do pool falha
        # ("jdbcUrl is required") e a aplicacao nao sobe. Faltando o secret, o pod para em
        # CreateContainerConfigError, que aponta o secret certo, em vez de um crash loop obscuro.
        - name: LEGACY_SYNC_ENABLED
          value: "true"
        # 1 min (padrao 5): encurta a janela em que a edicao feita nos dois sistemas e reconciliada.
        # O custo e proporcional ao volume de dados; a duracao de cada rodada sai no log.
        - name: LEGACY_SYNC_INTERVAL
          value: "PT1M"
        - name: LEGACY_DB_URL
          valueFrom:
            secretKeyRef:
              name: legacy-db
              key: url
        - name: LEGACY_DB_USER
          valueFrom:
            secretKeyRef:
              name: legacy-db
              key: user
        - name: LEGACY_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: legacy-db
              key: password
