apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-administrative-core
  namespace: production
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ms-administrative-core
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ms-administrative-core
    spec:
      containers:
      - name: ms-administrative-core
        image: southamerica-east1-docker.pkg.dev/zera-512810/repo/ms-administrative-core:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 3
        envFrom:
        # Bootstrap opcional do primeiro MANAGER (BOOTSTRAP_ADMIN_*). Ver k8s/README.md.
        - secretRef:
            name: ms-administrative-core-bootstrap
            optional: true
        env:
        - name: DB_HOST
          value: "postgres"
        # Fila de alertas (Redis Streams, ligada por padrao). Ver k8s/redis.yaml.
        # Nome "redis-alerts", NAO "redis": esse nome ja e usado pelo ms-artificial-intelligence-core
        # no mesmo namespace (seu proprio Deployment/Service), e colidiu com o nosso uma vez.
        - name: REDIS_HOST
          value: "redis-alerts"
        - name: REDIS_PORT
          value: "6379"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_DB
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_PASSWORD
        - name: ZERA_JWT_ISSUER
          value: "ms-administrative-core-prod"
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: ms-administrative-core-jwt
              key: private.pem
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: ms-administrative-core-jwt
              key: public.pem
        - name: MS_INVENTORY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: zera-service-clients
              key: ms-inventory
        # Sync periodico com o banco legado (LegacySyncConfig). SEM optional, de proposito: com o sync
        # ligado e a URL vazia o bean do pool falha ("jdbcUrl is required") e a aplicacao nao sobe.
        # Faltando o secret, o pod para em CreateContainerConfigError, que aponta o secret certo.
        # Crie o secret legacy-db no namespace production ANTES de subir este deployment (k8s/README.md).
        - name: LEGACY_SYNC_ENABLED
          value: "true"
        - name: LEGACY_SYNC_INTERVAL
          value: "PT1M"
        - name: LEGACY_DB_URL
          valueFrom:
            secretKeyRef:
              name: legacy-db
              key: url
        - name: LEGACY_DB_USER
          valueFrom:
            secretKeyRef:
              name: legacy-db
              key: user
        - name: LEGACY_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: legacy-db
              key: password
        # Recicladoras proximas (Google Places). optional: true para o pod nao entrar em
        # crash loop se o secret ainda nao existir — sem a chave, o endpoint responde 503
        # em vez de subir, ver GooglePlacesConfig.
        - name: GOOGLE_PLACES_ENABLED
          value: "true"
        - name: GOOGLE_PLACES_API_KEY
          valueFrom:
            secretKeyRef:
              name: google-places
              key: api-key
              optional: true