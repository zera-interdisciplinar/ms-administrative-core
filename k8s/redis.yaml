apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-alerts
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-alerts
  template:
    metadata:
      labels:
        app: redis-alerts
    spec:
      containers:
      - name: redis-alerts
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-alerts
  namespace: production
spec:
  selector:
    app: redis-alerts
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
