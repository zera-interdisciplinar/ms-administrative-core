spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

# O padrao de producao agora e a fila ligada, mas os testes com @SpringBootTest usam H2 e nao tem
# Redis disponivel -- sem desligar aqui, RedisStreamConfig tentaria conectar no boot do contexto e
# o indicador automatico de saude do Redis derrubaria /actuator/health.
zera.alerts.queue.enabled=false
management.health.redis.enabled=false