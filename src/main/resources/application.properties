spring.application.name=ms-administrative-core
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/index.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.use-root-path=true
server.forward-headers-strategy=framework

# --- Autenticacao / JWT ---
# Chaves RSA em formato PEM (PKCS#8 para a privada, X.509/SPKI para a publica).
# Se ambas ficarem em branco a aplicacao gera um par efemero no boot (apenas para dev/local).
zera.jwt.issuer=ms-administrative-core
zera.jwt.access-token-ttl=PT15M
zera.jwt.refresh-token-ttl=P7D
zera.jwt.private-key=${JWT_PRIVATE_KEY:}
zera.jwt.public-key=${JWT_PUBLIC_KEY:}

# --- Sync com o banco legado (Jakarta EE) ---
# Desligado por padrao. URL no formato jdbc:postgresql://HOST:PORTA/DB?sslmode=require
legacy-sync.enabled=${LEGACY_SYNC_ENABLED:false}
legacy-sync.interval=${LEGACY_SYNC_INTERVAL:PT5M}
legacy-sync.initial-delay=${LEGACY_SYNC_INITIAL_DELAY:PT10S}
legacy-sync.db.url=${LEGACY_DB_URL:}
legacy-sync.db.user=${LEGACY_DB_USER:}
legacy-sync.db.password=${LEGACY_DB_PASSWORD:}
# clientes de servico autorizados nas rotas internas (ZERA-266); o segredo vem do secret do ambiente
zera.service-auth.token-ttl=PT15M
zera.service-auth.clients.ms-inventory.secret=${MS_INVENTORY_CLIENT_SECRET:}
zera.service-auth.clients.ms-inventory.scopes=notifications:write

# --- Recicladoras proximas (Google Places API New) ---
# Desligada por padrao: sem chave nem custo ate uma decisao explicita de habilitar.
# A chave vem de Secret do k8s via env var; nunca um valor default aqui.
zera.places.enabled=${GOOGLE_PLACES_ENABLED:false}
zera.places.api-key=${GOOGLE_PLACES_API_KEY:}
zera.places.default-radius-meters=5000
zera.places.max-radius-meters=20000
zera.places.connect-timeout=5s
zera.places.read-timeout=5s
zera.places.max-retries=3
zera.places.retry-backoff=200ms
# TTL curto por exigencia dos Termos de Uso do Google (nome/endereco/coordenada nao podem virar
# um espelho local); serve so para conter custo de chamadas repetidas em pouco tempo.
zera.places.cache-ttl=PT6H
