spring.application.name=ms-administrative-core
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/index.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.use-root-path=true
server.forward-headers-strategy=framework

# --- Autenticacao / JWT ---
# Chaves RSA em formato PEM (PKCS#8 para a privada, X.509/SPKI para a publica).
# Se ambas ficarem em branco a aplicacao gera um par efemero no boot (apenas para dev/local).
zera.jwt.issuer=ms-administrative-core
zera.jwt.access-token-ttl=PT15M
zera.jwt.refresh-token-ttl=P7D
zera.jwt.private-key=${JWT_PRIVATE_KEY:}
zera.jwt.public-key=${JWT_PUBLIC_KEY:}

# --- Sync com o banco legado (Jakarta EE) ---
# Desligado por padrao. URL no formato jdbc:postgresql://HOST:PORTA/DB?sslmode=require
legacy-sync.enabled=${LEGACY_SYNC_ENABLED:false}
legacy-sync.interval=${LEGACY_SYNC_INTERVAL:PT5M}
legacy-sync.initial-delay=${LEGACY_SYNC_INITIAL_DELAY:PT10S}
legacy-sync.db.url=${LEGACY_DB_URL:}
legacy-sync.db.user=${LEGACY_DB_USER:}
legacy-sync.db.password=${LEGACY_DB_PASSWORD:}