name: Deploy QA

on:
  push:
    branches:
      - qa

env:
  REGISTRY: southamerica-east1-docker.pkg.dev
  IMAGE: southamerica-east1-docker.pkg.dev/zera-512810/repo/ms-administrative-core

jobs:
  deploy:
    name: Deploy to QA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/659911714707/locations/global/workloadIdentityPools/zera-pool/providers/github-provider
          service_account: github-actions-deploy@zera-512810.iam.gserviceaccount.com

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: zera-cluster
          location: southamerica-east1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build and Run Tests
        run: ./mvnw verify

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and Push Docker Image
        run: |
          ./mvnw package -DskipTests
          docker build \
            --tag ${{ env.IMAGE }}:qa \
            --tag ${{ env.IMAGE }}:qa-${{ github.sha }} \
            .
          docker push ${{ env.IMAGE }}:qa
          docker push ${{ env.IMAGE }}:qa-${{ github.sha }}

      - name: Deploy to GKE
        run: |
          kubectl apply -f k8s/redis-qa.yaml -n qa
          sed -i "s|IMAGE_TAG|qa-${{ github.sha }}|g" k8s/deployment-qa.yaml
          kubectl apply -f k8s/deployment-qa.yaml -n qa
          kubectl apply -f k8s/service-qa.yaml -n qa
          kubectl rollout status deployment/ms-administrative-core -n qa --timeout=180s

      - name: Seed de volume sintetico (QA)
        run: |
          # $POSTGRES_USER/$POSTGRES_DB precisam ser expandidos DENTRO do pod (sh -c), nao pelo
          # shell do runner -- ele nao tem essas variaveis, so o container do Postgres tem.
          kubectl exec -i -n qa deploy/postgres -- \
            sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f -' \
            < scripts/seed_qa.sql

      - name: Annotate Deployment
        run: |
          kubectl annotate deployment ms-administrative-core \
            -n qa \
            kubernetes.io/change-cause="QA deploy — commit ${{ github.sha }}" \
            --overwrite